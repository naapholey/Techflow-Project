name: Tech-flow Project Pipeline
run-name: Tech-flow Project Pipeline tested by ${{ github.actor }} on ${{ github.ref }}
on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Display Python version
        run: |
          python --version
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          pytest
      - name: Stop the pipeline if tests fail
        if: failure()
        run: |
          echo "Tests failed, stopping the pipeline."

  push-to-docker:
    runs-on: ubuntu-latest

    needs: build
    steps:
      - name: checkout code
        uses: actions/checkout@v3
      - name: setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DockerHub_Username}}
          password: ${{secrets.DockerHub_Password}}
      - name: build app
        run: docker build -t ${{secrets.DockerHub_Username}}/tech-flow:latest .
      - name: tag image as current sha
        run: docker tag ${{secrets.DockerHub_Username}}/tech-flow:latest ${{secrets.DockerHub_Username}}/tech-flow:${{ github.sha }}
      - name: verify build
        run: docker images # | grep ${{secrets.DockerHub_Username}}/teck-flow
      - name: push to Dockerhub
        run: |
            docker push ${{secrets.DockerHub_Username}}/tech-flow:latest
            docker push ${{ secrets.DockerHub_Username }}/tech-flow:${{ github.sha }}
      
  deploy-to-ec2:
    runs-on: ubuntu-latest
    needs: push-to-docker

    steps:
      - name: ssh to ec2
        uses: appleboy/ssh-action@master
        with: 
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # port: ${{ secrets.EC2_PORT }}
          script: pull ${{secrets.DockerHub_Username}}/tech-flow:latest
      - name: pull image from docker
        run: |
          docker pull ${{secrets.DockerHub_Username}}/tech-flow:latest
      - name: run the image
        run: |
          docker run -d -p 5000:5000 ${{secrets.DockerHub_Username}}/tech-flow:latest
