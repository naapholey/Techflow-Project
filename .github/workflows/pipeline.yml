name: Tech-flow Project Pipeline
run-name: Tech-flow Project Pipeline tested by ${{ github.actor }} on ${{ github.ref }}
on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Display Python version
        run: |
          python --version
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          pytest
      - name: Stop the pipeline if tests fail
        if: failure()
        run: |
          echo "Tests failed, stopping the pipeline."